name: Build and Deploy to EKS

on:
  push:
    branches:
      - main

permissions:
  contents: read
  id-token: write

env:
  AWS_REGION: ap-south-1
  ECR_REGISTRY: 093807117897.dkr.ecr.ap-south-1.amazonaws.com
  ECR_REPOSITORY: aws-devops-app
  EKS_CLUSTER: aws-devops-eks
  IMAGE_TAG: ${{ github.sha }}

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:

      # 1. Checkout application code
      - name: Checkout source code
        uses: actions/checkout@v6

      # 2. Test GitHub OIDC -> AWS STS
      - name: Test AWS STS OIDC
        shell: bash
        run: |
          echo "Requesting GitHub OIDC token..."

          TOKEN_JSON=$(curl -s \
            -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=sts.amazonaws.com")

          ID_TOKEN=$(echo "$TOKEN_JSON" | jq -r '.value')

          if [ -z "$ID_TOKEN" ] || [ "$ID_TOKEN" = "null" ]; then
            echo "ERROR: GitHub did not provide an OIDC token."
            exit 1
          fi

          echo "GitHub OIDC token received."
          echo "Testing AWS STS AssumeRoleWithWebIdentity..."

          aws sts assume-role-with-web-identity \
            --role-arn arn:aws:iam::093807117897:role/GitHubActions-EKS-Deploy-Role \
            --role-session-name github-actions-test \
            --web-identity-token "$ID_TOKEN" \
            --duration-seconds 900

          echo "SUCCESS: GitHub OIDC can assume the AWS IAM role."

      # 3. Configure AWS credentials
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6.3.0
        with:
          role-to-assume: arn:aws:iam::093807117897:role/GitHubActions-EKS-Deploy-Role
          aws-region: ${{ env.AWS_REGION }}

      # 4. Verify AWS identity
      - name: Verify AWS identity
        run: |
          aws sts get-caller-identity

      # 5. Login to Amazon ECR
      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      # 6. Build Docker image
      - name: Build Docker image
        run: |
          docker build \
            -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG .

      # 7. Push Docker image to ECR
      - name: Push Docker image to ECR
        run: |
          docker push \
            $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG

      # 8. Configure kubectl for EKS
      - name: Configure kubectl
        run: |
          aws eks update-kubeconfig \
            --region $AWS_REGION \
            --name $EKS_CLUSTER

      # 9. Verify EKS connection
      - name: Verify EKS connection
        run: |
          kubectl get pods -n default
          
      # 10. Deploy application to EKS
      - name: Deploy application to EKS
        run: |
          kubectl set image deployment/aws-devops-app \
            aws-devops-app=$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG

      # 11. Wait for deployment
      - name: Wait for deployment
        run: |
          kubectl rollout status deployment/aws-devops-app

      # 12. Verify application pods
      - name: Verify application pods
        run: |
          kubectl get pods -o wide