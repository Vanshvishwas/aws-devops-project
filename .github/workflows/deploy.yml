name: Build and Deploy to EKS

on:
  push:
    branches:
      - main

permissions:
  contents: read
  id-token: write

env:
  AWS_REGION: ap-south-1
  ECR_REGISTRY: 093807117897.dkr.ecr.ap-south-1.amazonaws.com
  ECR_REPOSITORY: aws-devops-app
  EKS_CLUSTER: aws-devops-eks
  IMAGE_TAG: ${{ github.sha }}

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:

      # --------------------------------------------------
      # 1. Get the application code from GitHub
      # --------------------------------------------------
      - name: Checkout source code
        uses: actions/checkout@v6


      # --------------------------------------------------
      # 2. Get and display GitHub OIDC claims
      # --------------------------------------------------
      - name: Show OIDC claims
        shell: bash
        run: |
          TOKEN_JSON=$(curl -s \
            -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=sts.amazonaws.com")

          ID_TOKEN=$(echo "$TOKEN_JSON" | jq -r '.value')

          echo "$ID_TOKEN" | cut -d '.' -f 2 | base64 -d 2>/dev/null | jq .


      # --------------------------------------------------
      # 3. Directly test GitHub OIDC -> AWS STS
      # --------------------------------------------------
      - name: Test AWS STS OIDC
        shell: bash
        run: |
          echo "Testing GitHub OIDC authentication with AWS STS..."

          TOKEN_JSON=$(curl -s \
            -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=sts.amazonaws.com")

          ID_TOKEN=$(echo "$TOKEN_JSON" | jq -r '.value')

          if [ -z "$ID_TOKEN" ] || [ "$ID_TOKEN" = "null" ]; then
            echo "ERROR: GitHub did not provide an OIDC token."
            exit 1
          fi

          if aws sts assume-role-with-web-identity \
            --role-arn arn:aws:iam::093807117897:role/GitHubActions-EKS-Deploy-Role \
            --role-session-name github-actions-test \
            --web-identity-token "$ID_TOKEN" \
            --duration-seconds 900 \
            > /tmp/sts-response.json 2>&1
          then
            echo "SUCCESS: GitHub OIDC can assume the AWS IAM role."
          else
            echo "ERROR: AWS STS rejected the GitHub OIDC token."
            cat /tmp/sts-response.json
            exit 1
          fi


      # --------------------------------------------------
      # 4. Configure AWS credentials
      # --------------------------------------------------
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6.3.0
        with:
          role-to-assume: arn:aws:iam::093807117897:role/GitHubActions-EKS-Deploy-Role
          aws-region: ${{ env.AWS_REGION }}


      # --------------------------------------------------
      # 5. Verify AWS identity
      # --------------------------------------------------
      - name: Verify AWS identity
        run: |
          aws sts get-caller-identity


      # --------------------------------------------------
      # 6. Login to Amazon ECR
      # --------------------------------------------------
      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2


      # --------------------------------------------------
      # 7. Build Docker image
      # --------------------------------------------------
      - name: Build Docker image
        run: |
          docker build \
            -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG .


      # --------------------------------------------------
      # 8. Push Docker image to ECR
      # --------------------------------------------------
      - name: Push Docker image to ECR
        run: |
          docker push \
            $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG


      # --------------------------------------------------
      # 9. Configure kubectl for EKS
      # --------------------------------------------------
      - name: Configure kubectl
        run: |
          aws eks update-kubeconfig \
            --region $AWS_REGION \
            --name $EKS_CLUSTER


      # --------------------------------------------------
      # 10. Verify EKS connection
      # --------------------------------------------------
      - name: Verify EKS connection
        run: |
          kubectl get nodes


      # --------------------------------------------------
      # 11. Deploy new image to Kubernetes
      # --------------------------------------------------
      - name: Deploy application to EKS
        run: |
          kubectl set image deployment/aws-devops-app \
            aws-devops-app=$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG


      # --------------------------------------------------
      # 12. Wait for Kubernetes deployment
      # --------------------------------------------------
      - name: Wait for deployment
        run: |
          kubectl rollout status deployment/aws-devops-app


      # --------------------------------------------------
      # 13. Verify application pods
      # --------------------------------------------------
      - name: Verify application pods
        run: |
          kubectl get pods -o wide